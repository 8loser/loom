<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loom</title>
<style>
  :root {
    --bg: #f4f7f6; --surface: #ffffff; --surface-2: #e9efee;
    --border: #d7e0de; --border-strong: #bfcdca; --text: #141d1c; --muted: #5d6d6b;
    --accent: #0f7466; --accent-soft: #d7ebe7;
    --ok: #3d7a36; --ok-soft: #e0eedd;
    --warn: #94670f; --warn-soft: #f5e9cf;
    --crit: #a63d2c; --crit-soft: #f6e0db;
    --idle: #8a9997;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1211; --surface: #141b1a; --surface-2: #1a2322;
      --border: #253130; --border-strong: #354443; --text: #dbe5e3; --muted: #7f918f;
      --accent: #4ec2ae; --accent-soft: #123330;
      --ok: #62b055; --ok-soft: #16290f;
      --warn: #d09b3a; --warn-soft: #302408;
      --crit: #d76a55; --crit-soft: #331612;
      --idle: #4e5f5d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1211; --surface: #141b1a; --surface-2: #1a2322;
    --border: #253130; --border-strong: #354443; --text: #dbe5e3; --muted: #7f918f;
    --accent: #4ec2ae; --accent-soft: #123330;
    --ok: #62b055; --ok-soft: #16290f;
    --warn: #d09b3a; --warn-soft: #302408;
    --crit: #d76a55; --crit-soft: #331612;
    --idle: #4e5f5d;
  }
  :root[data-theme="light"] {
    --bg: #f4f7f6; --surface: #ffffff; --surface-2: #e9efee;
    --border: #d7e0de; --border-strong: #bfcdca; --text: #141d1c; --muted: #5d6d6b;
    --accent: #0f7466; --accent-soft: #d7ebe7;
    --ok: #3d7a36; --ok-soft: #e0eedd;
    --warn: #94670f; --warn-soft: #f5e9cf;
    --crit: #a63d2c; --crit-soft: #f6e0db;
    --idle: #8a9997;
  }

  * { box-sizing: border-box; }
  :root { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans TC", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .label {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted);
  }

  /* flex 而不是 grid-template-rows：attention 空的時候是 display:none，固定行數的
     grid 會讓下面的 pane 遞補到 auto 行，整個版面縮成內容高度、留一大塊空白。 */
  .app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .app > * { flex: none; }
  .app > .main, .app > .sheet, .app > .chatpane { flex: 1; min-height: 0; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 20px; padding: 5px 16px; min-height: 46px;
    flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 15px; font-weight: 600; letter-spacing: 0.16em; color: var(--accent);
  }
  #ws-select {
    display: flex; align-items: center; gap: 7px; padding: 4px 9px;
    border: 1px solid var(--border-strong); border-radius: 3px; background: var(--surface-2);
    color: var(--text); cursor: pointer;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px;
  }
  .tabs { display: flex; gap: 2px; }
  .tab {
    appearance: none; border: 1px solid transparent; background: none; color: var(--muted);
    padding: 4px 11px; border-radius: 3px; cursor: pointer;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .meters { display: flex; gap: 16px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .meter { display: flex; align-items: baseline; gap: 6px; }
  .meter .v {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-size: 13px;
  }

  /* ---------- attention strip ---------- */
  .attention { display: flex; flex-direction: column; border-bottom: 1px solid var(--border); }
  .attention:empty { display: none; }
  .banner { display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-left: 3px solid transparent; flex-wrap: wrap; }
  .banner + .banner { border-top: 1px solid var(--border); }
  .banner.ready-to-merge { background: var(--ok-soft); border-left-color: var(--ok); }
  .banner.stuck { background: var(--crit-soft); border-left-color: var(--crit); }
  .banner .tag {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; font-weight: 600;
  }
  .banner.ready-to-merge .tag { color: var(--ok); }
  .banner.stuck .tag { color: var(--crit); }
  .banner .what { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
  .banner .why { color: var(--muted); font-size: 12.5px; }
  .banner .acts { margin-left: auto; display: flex; gap: 6px; }

  .btn {
    appearance: none; font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 3px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); color: var(--surface); }

  /* ---------- main split ---------- */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 0; }
  /* [hidden] 要贏過上面的 display:grid，分頁切換靠它 */
  [hidden] { display: none !important; }

  /* ---------- board ---------- */
  .board { overflow: auto; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(178px, 1fr)); min-width: 900px; }
  /* 還沒有 workspace 時看板是空的，min-width 仍會撐出一條沒東西可捲的橫捲軸。 */
  .grid:empty { min-width: 0; }
  .colhead {
    position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 9px 12px 7px;
    border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 7px;
  }
  .lane {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; width: 100%;
    text-align: left; appearance: none; border: 0; border-bottom: 1px solid var(--border);
    padding: 11px 12px 9px; background: var(--surface-2); color: var(--text); font: inherit; cursor: pointer;
  }
  .lane:hover { background: var(--accent-soft); }
  .lane.on { box-shadow: inset 2px 0 0 var(--accent); }
  .lane.err { background: var(--crit-soft); cursor: default; }
  .lane .name { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
  .lane .branch { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
  .lane .spacer { margin-left: auto; }
  .prog { display: flex; align-items: center; gap: 7px; }
  .bar { width: 84px; height: 3px; background: var(--border-strong); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .prog .c { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .cell {
    padding: 8px; display: flex; flex-direction: column; gap: 7px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 62px;
  }
  .cell:nth-child(6n + 5) { border-right: none; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-left: 2px solid var(--idle);
    border-radius: 3px; padding: 7px 9px; display: flex; flex-direction: column; gap: 4px;
    cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%;
  }
  .card:hover { border-color: var(--border-strong); border-left-color: var(--accent); }
  .card.live { border-left-color: var(--accent); }
  .card.retry { border-left-color: var(--warn); }
  .card.halted { border-left-color: var(--crit); }
  .card.manual { border-left-color: var(--warn); border-left-style: dashed; }
  .card.shipped { border-left-color: var(--ok); opacity: 0.72; }
  .card.dropped { border-left-color: var(--idle); opacity: 0.55; }
  .card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .id { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.35; word-break: break-word; }
  .card .id b { color: var(--accent); font-weight: 600; }
  .card .foot {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .card .foot .hot { color: var(--warn); }
  .card .foot .bad { color: var(--crit); }
  .card .foot .good { color: var(--ok); }
  .card .cardacts { margin-top: 2px; }
  .card .cardacts .btn { font-size: 11px; padding: 2px 8px; }

  .pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: beat 1.6s ease-in-out infinite; flex: none; }
  @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .queued { color: var(--idle); font-size: 11.5px; padding: 3px 2px; }

  .fold {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; width: 100%;
    text-align: left; appearance: none; border: 0; border-bottom: 1px solid var(--border);
    background: none; cursor: pointer; padding: 10px 12px; color: var(--muted); font: inherit;
  }
  .fold:hover { background: var(--surface-2); color: var(--text); }
  .fold .tw { font-size: 8px; flex: none; }
  .fold .ttl {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; flex: none;
  }
  .fold .names {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--idle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }

  .e2e {
    font-size: 9.5px; letter-spacing: 0.09em; padding: 1px 5px; border-radius: 2px;
    background: var(--warn-soft); color: var(--warn); flex: none;
  }

  /* ---------- detail ---------- */
  .detail { border-left: 1px solid var(--border); background: var(--surface); min-height: 0; overflow: auto; }
  .dpanel { display: grid; grid-template-rows: auto auto 1fr; height: 100%; min-height: 0; }
  .dpanel[hidden] { display: none; }
  .cmts { overflow: auto; padding: 11px 0 14px; min-height: 0; }
  .cmts .ch { padding: 0 14px 8px; }
  .cmt { padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .cmt p { margin: 0; font-size: 12.5px; }
  .dfoot { display: flex; gap: 7px; padding: 11px 14px; border-top: 1px solid var(--border); }
  .dfoot[hidden] { display: none; }
  .dfoot .btn { flex: 1; }
  .note-run { padding: 14px; color: var(--muted); font-size: 12.5px; }
  .dhead { padding: 13px 14px 11px; border-bottom: 1px solid var(--border); }
  .dhead h2 {
    margin: 3px 0 0; font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 13.5px; font-weight: 600; line-height: 1.4;
  }
  .dhead .sub { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .facts {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; padding: 11px 14px;
    border-bottom: 1px solid var(--border); align-items: baseline;
  }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .facts dd.warnish { color: var(--warn); }
  .facts dd.critish { color: var(--crit); }

  .stream { overflow: auto; padding: 10px 0 14px; min-height: 0; }
  .stream .st-head { display: flex; align-items: center; gap: 7px; padding: 0 14px 8px; }
  .line {
    display: grid; grid-template-columns: 52px 40px 1fr; gap: 8px; padding: 2.5px 14px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.5;
  }
  .line:hover { background: var(--surface-2); }
  .line .t { color: var(--idle); font-variant-numeric: tabular-nums; }
  .line .k { color: var(--muted); }
  .line .m { word-break: break-word; }
  .line.tool .k { color: var(--accent); }
  .line.say .m { color: var(--muted); }
  .line.now .m { color: var(--text); }

  .addws { display: flex; gap: 6px; align-items: center; }
  .addws input {
    font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 3px;
    border: 1px solid var(--border-strong); background: var(--bg); color: var(--text); width: 15ch;
  }
  #err { color: var(--crit); font-size: 12.5px; padding: 6px 16px; min-height: 1.4em; }

  /* ---------- settings ---------- */
  .sheet { max-width: 680px; padding: 26px 24px 40px; overflow: auto; }
  .sheet h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; text-wrap: balance; }
  .sheet .lede { color: var(--muted); margin: 0 0 22px; max-width: 58ch; font-size: 12.5px; }
  .sheet .grp { margin-top: 26px; }
  .sheet .grp .label { display: block; margin-bottom: 6px; }
  .grphd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .grphd .label { margin: 0; }
  .grphd .aside { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .field {
    display: grid; grid-template-columns: 168px 1fr; gap: 12px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .field .in {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px; border: 1px solid var(--border-strong); border-radius: 3px;
    padding: 5px 8px; background: var(--bg); word-break: break-all;
  }
  .field .in.ro { border-style: dashed; border-color: var(--border); background: transparent; color: var(--muted); }
  .field .in.good { color: var(--ok); }
  .field .in.warn { color: var(--warn); }

  .proles { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .prole {
    appearance: none; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--muted); border-radius: 3px; padding: 4px 10px; cursor: pointer;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px;
  }
  .prole:hover { color: var(--text); }
  .prole:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .prole[aria-current="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  #ptext {
    display: block; width: 100%; box-sizing: border-box; margin: 0; resize: vertical;
    border: 1px solid var(--border-strong); border-radius: 3px; background: var(--bg); color: var(--text);
    padding: 11px 12px; min-height: 340px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.6;
  }
  .pvars {
    margin: 8px 0 0; font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
  }
  .pfoot {
    display: flex; align-items: center; gap: 12px; margin-top: 12px; padding-top: 11px;
    border-top: 1px solid var(--border);
  }
  .pfoot .lock {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
  }
  .pfoot .spacer { margin-left: auto; }
  .pfoot .saved { font-size: 11.5px; color: var(--ok); }

  /* ---------- 討論 ---------- */
  .chatpane { display: flex; flex-direction: column; min-height: 0; }
  .thread { overflow: auto; padding: 20px 24px; flex: 1; min-height: 0; }
  .turn { max-width: 62ch; margin: 0 0 20px; }
  .turn .who {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
  }
  .turn.me .who { color: var(--accent); }
  .turn p { margin: 0 0 9px; white-space: pre-wrap; }
  .composer {
    border-top: 1px solid var(--border); padding: 12px 24px 16px; background: var(--surface);
    display: flex; flex-direction: column; gap: 8px; flex: none;
  }
  #chat-input {
    display: block; width: 100%; box-sizing: border-box; resize: vertical; min-height: 52px;
    border: 1px solid var(--border-strong); border-radius: 3px; background: var(--bg); color: var(--text);
    padding: 9px 11px; font: inherit; font-size: 13px;
  }
  .cfoot { display: flex; align-items: center; gap: 10px; }
  .cfoot .note { font-size: 11.5px; color: var(--muted); }
  .cfoot .spacer { margin-left: auto; }

  #picker, #newws {
    border: 1px solid var(--border-strong); border-radius: 4px; padding: 0;
    background: var(--surface); color: var(--text); width: min(560px, 90vw);
  }
  #picker::backdrop, #newws::backdrop { background: rgba(0, 0, 0, 0.5); }
  #newws .addws { padding: 14px; flex-wrap: wrap; }
  #newws-acts { display: flex; gap: 8px; align-items: center; padding: 0 14px 14px; }
  /* modal 開著時背後的 #err 會被 backdrop 蓋掉，所以這裡自己顯示錯誤。 */
  #newws-err { color: var(--crit); font-size: 12px; margin-right: auto; }
  #picker-path {
    padding: 10px 14px; border-bottom: 1px solid var(--border-strong); font-size: 12px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; word-break: break-all;
  }
  #picker-list { list-style: none; margin: 0; padding: 4px 0; max-height: 50vh; overflow-y: auto; }
  #picker-list li { padding: 5px 14px; font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #picker-list li:hover { background: var(--bg); }
  #picker-list .repo { font-size: 10px; color: var(--accent); border: 1px solid var(--accent); border-radius: 2px; padding: 0 4px; }
  #picker-acts { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--border-strong); }
</style>

<div class="app">
  <header class="topbar" id="topbar"></header>
  <section class="attention" id="attention"></section>
  <div class="main" id="pane-board">
    <div class="board"><div class="grid" id="grid"></div></div>
    <aside class="detail" id="detail"></aside>
  </div>
  <div class="chatpane" id="pane-chat" hidden>
    <div class="thread" id="chat-thread"></div>
    <div class="composer">
      <textarea id="chat-input" placeholder="說說想改什麼、或想加什麼功能…" spellcheck="false"></textarea>
      <div class="cfoot">
        <span class="note" id="chat-note"></span>
        <span class="spacer"></span>
        <button class="btn" id="chat-send">送出</button>
        <button class="btn primary" id="chat-finalize" disabled>建立並開始執行</button>
      </div>
    </div>
  </div>
  <div class="sheet" id="pane-settings" hidden></div>
  <!-- 放在 .app 裡：放外面時 body 會比 100dvh 高出這一條，永遠有一根直捲軸。 -->
  <div id="err"></div>
</div>

<dialog id="newws">
  <div class="addws">
    <input id="new-ws-name" placeholder="workspace 名稱">
    <input id="new-ws-path" placeholder="/絕對路徑/到/repo" style="width:26ch">
    <button class="btn" id="browse-ws">瀏覽…</button>
  </div>
  <div id="newws-acts">
    <span id="newws-err"></span>
    <button class="btn" id="newws-cancel">取消</button>
    <button class="btn primary" id="add-ws">新增</button>
  </div>
</dialog>

<dialog id="picker">
  <div id="picker-path"></div>
  <ul id="picker-list"></ul>
  <div id="picker-acts">
    <button class="btn" id="picker-cancel">取消</button>
    <button class="btn primary" id="picker-pick">選這個資料夾</button>
  </div>
</dialog>

<script>
const ISSUE_LABEL = {
  draft: "草稿", ready: "待開工", implementing: "實作中", review_ready: "待審查",
  reviewing: "審查中", test_ready: "待測試", testing: "測試中", done: "完成",
  blocked: "卡住", human: "等人處理", dropped: "已捨棄",
};
const SPEC_LABEL = {
  merged: "已合併", spec_blocked: "spec 卡住", blocked: "卡住", human: "等人處理",
  running: "執行中", verifying: "驗證中", mergeable: "可以合併", queued: "排隊中",
  draft: "草稿", import_needed: "需匯入",
};
const ROLE_LABEL = { coder: "coder", issue_reviewer: "reviewer", test: "test" };
const LIVE_KIND_LABEL = { say: "說", read: "讀取", edit: "編輯", bash: "指令", search: "搜尋", tool: "工具", port: "連線埠" };
// blocked/human 沒有記憶「卡住前最後停在哪個 agent 階段」（front matter 只
// 存目前狀態，不存歷史），所以一律歸類到待處理欄，靠卡片自己的樣式
// （halted/manual）分辨，不是真的還沒開工。
const COLUMNS = [
  { label: "待處理", match: (i) => ["draft", "ready", "blocked", "human"].includes(i.status) },
  { label: "實作中", match: (i) => i.status === "implementing" },
  { label: "審查中", match: (i) => ["review_ready", "reviewing"].includes(i.status) },
  { label: "測試中", match: (i) => ["test_ready", "testing"].includes(i.status) },
  { label: "完成", match: (i) => ["done", "dropped"].includes(i.status) },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fmtTokens(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}
function fmtCost(usd) { return "$" + usd.toFixed(2); }
function fmtElapsed(ms) {
  if (ms == null) return "-";
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

let workspaces = [];
let currentWs = null;
let board = null; // 目前 workspace 最近一次抓到的 board 回應
let selection = null; // {type:'spec', spec} | {type:'issue', spec, issue} | null
let liveTimer = null;
let tab = "board"; // 'board' | 'chat' | 'settings'
let settings = null; // 設定分頁最近一次抓到的 /settings 與 /prompts
let promptRole = "coder"; // 設定頁目前編輯中的角色
let chat = null; // 討論分頁最近一次抓到的逐字稿 {transcript}
let chatBusy = false; // 送出中或定稿中，鎖住輸入避免重複送出

async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error ?? res.statusText);
  return body;
}

function say(text) { $("err").textContent = text ?? ""; }

async function refresh() {
  try {
    workspaces = await api("/api/workspaces");
    if (!workspaces.some((w) => w.name === currentWs)) currentWs = workspaces[0]?.name ?? null;
    board = currentWs ? await api(`/api/workspaces/${encodeURIComponent(currentWs)}/board`) : null;
    say("");
  } catch (err) {
    say(`讀看板失敗：${err.message}`);
    return;
  }
  render();
}

function findSpec(spec) { return board?.specs.find((s) => s.spec === spec) ?? null; }
function findIssue(spec, issue) { return findSpec(spec)?.issues.find((i) => i.id === issue) ?? null; }

function render() {
  renderTopbar();
  $("pane-board").hidden = tab !== "board";
  $("pane-chat").hidden = tab !== "chat";
  $("pane-settings").hidden = tab !== "settings";
  $("attention").hidden = tab !== "board";
  // 設定頁與討論頁自己管重繪。這裡不碰它們，否則 SSE 事件或 10 秒的保底
  // poll 會在使用者編輯提示詞、或打字打到一半時把畫面整個換掉。
  if (tab === "settings" || tab === "chat") return;
  renderAttention();
  renderGrid();
  renderDetail();
  restartLiveTick();
}

function renderTopbar() {
  const topbar = $("topbar");
  if (!currentWs) {
    topbar.innerHTML = `<span class="brand">LOOM</span>
      <button class="btn primary" id="open-newws">新增 workspace</button>`;
    $("open-newws").addEventListener("click", openNewWorkspace);
    return;
  }
  const ws = workspaces.find((w) => w.name === currentWs);
  const s = board.summary;
  const opts = workspaces.map((w) => `<option value="${esc(w.name)}" ${w.name === currentWs ? "selected" : ""}>${esc(w.name)}</option>`).join("");
  topbar.innerHTML = `
    <span class="brand">LOOM</span>
    <select id="ws-select">${opts}</select>
    <button class="btn" id="open-newws" title="新增 workspace">+</button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="board" aria-selected="${tab === "board"}">看板</button>
      <button class="tab" role="tab" data-tab="chat" aria-selected="${tab === "chat"}">討論</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="${tab === "settings"}">設定</button>
    </div>
    <div class="meters">
      <span class="meter"><span class="label">同時執行</span><span class="v">${s.runningCount} / ${ws.parallelLimit}</span></span>
      <span class="meter"><span class="label">近 24h token</span><span class="v">輸入 ${fmtTokens(s.recentInputTokens)} · 輸出 ${fmtTokens(s.recentOutputTokens)}</span></span>
      <span class="meter"><span class="label">近 24h 花費</span><span class="v">${fmtCost(s.recentCostUsd)}</span></span>
      <span class="meter">${board.paused ? "" : '<span class="pulse" aria-hidden="true"></span>'}<span class="v">${board.paused ? "已暫停" : "執行中"}</span></span>
      <button class="btn" id="toggle-pause">${board.paused ? "繼續" : "暫停"}</button>
    </div>`;
  $("ws-select").addEventListener("change", (e) => { currentWs = e.target.value; selection = null; settings = null; chat = null; refresh(); });
  $("open-newws").addEventListener("click", openNewWorkspace);
  for (const el of topbar.querySelectorAll(".tab[data-tab]")) {
    el.addEventListener("click", () => switchTab(el.dataset.tab));
  }
  $("toggle-pause").addEventListener("click", async () => {
    await api(`/api/workspaces/${encodeURIComponent(currentWs)}/${board.paused ? "resume" : "pause"}`, { method: "POST" });
    refresh();
  });
  if (board.error) say(`排程器上次執行時出錯：${board.error}`);
}

async function switchTab(next) {
  tab = next;
  if (tab === "settings" && !settings) {
    try {
      const base = `/api/workspaces/${encodeURIComponent(currentWs)}`;
      const [info, prompts] = await Promise.all([api(`${base}/settings`), api(`${base}/prompts`)]);
      settings = { ...info, roles: prompts.roles };
      say("");
    } catch (err) {
      say(`讀設定失敗：${err.message}`);
      return;
    }
  }
  if (tab === "chat" && !chat) {
    try {
      chat = await api(`/api/workspaces/${encodeURIComponent(currentWs)}/chat`);
      say("");
    } catch (err) {
      say(`讀討論失敗：${err.message}`);
      return;
    }
  }
  render();
  if (tab === "settings") renderSettings();
  if (tab === "chat") renderChat();
}

function field(label, value, cls = "") {
  return `<div class="field"><span class="label">${esc(label)}</span><span class="in ${cls}">${esc(value)}</span></div>`;
}

function renderSettings() {
  const el = $("pane-settings");
  if (!settings) { el.innerHTML = '<p class="note-run">讀取中…</p>'; return; }
  const ws = settings.workspace;
  const role = settings.roles.find((r) => r.role === promptRole) ?? settings.roles[0];

  // 名稱清單由後端給（devserver.ts 的 SCRIPTS 是唯一來源），不在前端再寫一份。
  // 固定列 loom:* 那幾個，加上專案實際定義的慣例退回名稱（typecheck/dev/test）。
  const scriptNames = [...new Set([...settings.scriptNames, ...Object.keys(settings.scripts)])];
  const scriptRows = scriptNames
    .map((name) => field(name, settings.scripts[name] ?? "未定義", "ro"))
    .join("");

  const roleTabs = settings.roles
    .map((r) => `<button class="prole" data-role="${esc(r.role)}" aria-current="${r.role === role.role}">${esc(r.role)}</button>`)
    .join("");

  el.innerHTML = `
    <h2>${esc(ws.name)}</h2>
    <p class="lede">要跑的指令寫在專案自己的 <code>package.json</code> 裡，loom 只認 <code>loom:</code> 開頭的 script。改了那邊這裡自動跟上。</p>

    ${field("專案路徑", ws.repoPath)}
    ${field("spec 資料夾", ws.specsDir)}
    ${field("主分支", ws.mainBranch)}

    <div class="grp">
      <div class="grphd"><span class="label">檢查項</span></div>
      ${field("CLAUDE.md", settings.checks.claudeMd ? "找到，agent 會自動載入" : "找不到", settings.checks.claudeMd ? "ro good" : "ro warn")}
      ${field("CONTEXT.md", settings.checks.contextMd ? "找到" : "找不到，建議先跑 /domain-modeling", settings.checks.contextMd ? "ro good" : "ro warn")}
    </div>

    <div class="grp">
      <div class="grphd"><span class="label">讀到的指令</span><span class="aside">package.json</span></div>
      ${scriptRows}
    </div>

    <div class="grp">
      <div class="grphd"><span class="label">限制</span></div>
      ${field("同時執行的 spec", String(ws.parallelLimit))}
      ${field("連線埠範圍", `${ws.portRangeStart} - ${ws.portRangeEnd}`)}
    </div>

    <div class="grp">
      <div class="grphd"><span class="label">提示詞</span><span class="aside">預設內容取自 mattpocock/skills，MIT</span></div>
      <div class="proles">${roleTabs}</div>
      <textarea id="ptext" spellcheck="false">${esc(role.template)}</textarea>
      <p class="pvars">可用變數 ${role.variables.map((v) => `{${v}}`).join(" ")}</p>
      <div class="pfoot">
        <span class="lock">${role.schema ? `輸出 schema 唯讀 · {${Object.keys(role.schema.properties).join(", ")}}` : "沒有輸出 schema"}</span>
        <span class="spacer"></span>
        <span class="saved" id="prompt-saved"></span>
        <button class="btn" id="prompt-reset" ${role.isDefault ? "disabled" : ""}>還原預設</button>
        <button class="btn primary" id="prompt-save">儲存</button>
      </div>
    </div>`;

  for (const btn of el.querySelectorAll(".prole[data-role]")) {
    btn.addEventListener("click", () => { promptRole = btn.dataset.role; renderSettings(); });
  }
  $("prompt-save").addEventListener("click", () => savePrompt(role.role));
  $("prompt-reset").addEventListener("click", () => resetPrompt(role.role));
}

/** 存檔與還原是同一個形狀：打一次 API，用結果更新本地那筆，重繪，報一句。 */
async function updatePrompt(role, { what, opts, apply }) {
  let result;
  try {
    result = await api(`/api/workspaces/${encodeURIComponent(currentWs)}/prompts/${encodeURIComponent(role)}`, opts);
  } catch (err) {
    say(`${what}失敗：${err.message}`);
    return;
  }
  apply(settings.roles.find((r) => r.role === role), result);
  renderSettings();
  $("prompt-saved").textContent = `已${what}`;
}

function savePrompt(role) {
  const template = $("ptext").value;
  return updatePrompt(role, {
    what: "儲存",
    opts: { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ template }) },
    apply: (entry) => Object.assign(entry, { template, isDefault: false }),
  });
}

function renderChat() {
  const thread = $("chat-thread");
  const turns = chat?.transcript ?? [];
  thread.innerHTML = turns.length
    ? turns.map((t) => `
        <article class="turn ${t.role === "user" ? "me" : ""}">
          <div class="who">${t.role === "user" ? "我" : "loom"}</div>
          <p>${esc(t.text)}</p>
        </article>`).join("")
    : '<p class="note-run">說說想改什麼、或想加什麼功能，開始討論。</p>';
  thread.scrollTop = thread.scrollHeight;

  $("chat-input").disabled = chatBusy;
  $("chat-send").disabled = chatBusy;
  $("chat-finalize").disabled = chatBusy || turns.length === 0;
  $("chat-note").textContent = chatBusy ? "處理中…" : "";
}

async function sendChatMsg() {
  const input = $("chat-input");
  const text = input.value.trim();
  if (!text || chatBusy) return;
  chatBusy = true;
  renderChat();
  try {
    const result = await api(`/api/workspaces/${encodeURIComponent(currentWs)}/chat/messages`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text }),
    });
    chat = { transcript: result.transcript };
    input.value = "";
    say("");
  } catch (err) {
    say(`討論失敗：${err.message}`);
  }
  chatBusy = false;
  renderChat();
}

// 定稿按鈕就是開跑按鈕（DESIGN.md「chat 產 spec」）：沒有額外的草稿預覽
// 步驟，按下去直接寫檔、commit、開始跑，成功後切去看板看新 spec。
async function finalizeChat() {
  if (chatBusy) return;
  chatBusy = true;
  renderChat();
  try {
    const result = await api(`/api/workspaces/${encodeURIComponent(currentWs)}/chat/finalize`, { method: "POST" });
    chat = null;
    chatBusy = false;
    tab = "board";
    selection = { type: "spec", spec: result.slug };
    say("");
    await refresh(); // 看板要立刻看到剛建立的 spec，不能只靠 SSE 事件的來回時間差
    return;
  } catch (err) {
    say(`定稿失敗：${err.message}`);
  }
  chatBusy = false;
  renderChat();
}

$("chat-send").addEventListener("click", sendChatMsg);
$("chat-finalize").addEventListener("click", finalizeChat);
$("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendChatMsg(); }
});

function resetPrompt(role) {
  return updatePrompt(role, {
    what: "還原成出廠預設",
    opts: { method: "DELETE" },
    apply: (entry, result) => Object.assign(entry, { template: result.template, isDefault: true }),
  });
}

function renderAttention() {
  const el = $("attention");
  if (!board) { el.innerHTML = ""; return; }
  const banners = [];
  for (const spec of board.specs) {
    if (spec.status === "import_needed") continue;
    if (spec.status === "mergeable") {
      banners.push(`<div class="banner ready-to-merge">
        <span class="tag">可以收了</span>
        <span class="what">${esc(spec.spec)}</span>
        <span class="why">${spec.issues.length} 個 issue 全過，落後 main ${spec.behindMain ?? "?"} 個 commit</span>
        <span class="acts"><button class="btn primary" data-act="merge" data-spec="${esc(spec.spec)}">合併到 main</button></span>
      </div>`);
    } else if (spec.status === "blocked" || spec.status === "human") {
      const stuck = spec.issues.find((i) => i.status === "blocked" || i.status === "human");
      const why = (stuck && spec.issueFailures[stuck.id]) ?? (spec.status === "human" ? "等人決定怎麼做" : "重試次數已用完");
      banners.push(`<div class="banner stuck">
        <span class="tag">${spec.status === "human" ? "等人處理" : "卡住了"}</span>
        <span class="what">${esc(spec.spec)}${stuck ? ` / ${esc(stuck.id)} ${esc(stuck.title)}` : ""}</span>
        <span class="why">${esc(why)}</span>
        ${stuck ? `<span class="acts"><button class="btn" data-act="redo" data-spec="${esc(spec.spec)}" data-issue="${esc(stuck.id)}">退回 ready</button></span>` : ""}
      </div>`);
    } else if (spec.status === "spec_blocked") {
      banners.push(`<div class="banner stuck">
        <span class="tag">spec 卡住</span>
        <span class="what">${esc(spec.spec)}</span>
        <span class="why">${esc(spec.blockedReason ?? "")} -- 需要手動處理 git 狀態，看詳情裡的說明</span>
      </div>`);
    }
  }
  el.innerHTML = banners.join("");
}

function issueCard(spec, issue) {
  const classes = ["card"];
  const live = spec.currentIssue && spec.currentIssue.id === issue.id ? spec.currentIssue : null;
  if (live) classes.push("live");
  if (live && live.attempt > 1) classes.push("retry");
  if (issue.status === "blocked") classes.push("halted");
  if (issue.status === "human") classes.push("manual");
  if (issue.status === "done") classes.push("shipped");
  if (issue.status === "dropped") classes.push("dropped");
  if (selection?.type === "issue" && selection.spec === spec.spec && selection.issue === issue.id) classes.push("on");

  const idLine = `<span class="id"><b>${esc(issue.id)}</b> ${esc(issue.title)}</span>`;
  const e2eTag = issue.e2e ? '<span class="e2e">E2E</span>' : "";
  let foot = "";
  let acts = "";

  if (live) {
    const attempt = live.attempt > 1 ? `<span class="hot">第 ${live.attempt} / ${spec.domainMaxAttempts} 次</span>` : "";
    const diff = live.diffStat ? `<span><span style="color:var(--ok)">+${live.diffStat.insertions}</span> <span style="color:var(--crit)">-${live.diffStat.deletions}</span></span>` : "";
    foot = `<span class="foot"><span class="pulse" aria-hidden="true"></span>
      <span>${esc(ROLE_LABEL[live.role] ?? live.role)}</span>
      <span class="live-elapsed" data-since="${live.startedAt}">${fmtElapsed(Date.now() - live.startedAt)}</span>
      ${attempt}${diff}${e2eTag}</span>`;
  } else if (issue.status === "blocked") {
    const r = spec.issueRetries[issue.id];
    const label = r ? `${r.domain} / ${spec.domainMaxAttempts} 次未通過` : "未通過";
    foot = `<span class="foot"><span class="bad">${esc(label)}</span>${e2eTag}</span>`;
  } else if (issue.status === "human") {
    foot = `<span class="foot"><span class="hot">等你動手</span>${e2eTag}</span>
      <span class="foot cardacts"><button class="btn" data-act="redo" data-spec="${esc(spec.spec)}" data-issue="${esc(issue.id)}">退回 ready</button></span>`;
  } else if (issue.status === "done") {
    const staleTag = issue.stale ? '<span class="hot">來源已變更</span>' : "";
    const e2ePass = issue.e2e ? '<span class="good">e2e 通過</span>' : "";
    foot = staleTag || e2ePass ? `<span class="foot">${staleTag}${e2ePass}</span>` : "";
    if (issue.stale) acts = `<span class="foot cardacts">
      <button class="btn" data-act="redo" data-spec="${esc(spec.spec)}" data-issue="${esc(issue.id)}">重做</button>
      <button class="btn" data-act="acknowledge-stale" data-spec="${esc(spec.spec)}" data-issue="${esc(issue.id)}">忽略變更</button>
    </span>`;
  } else if (issue.status === "dropped") {
    foot = '<span class="foot">已捨棄</span>';
  } else if (e2eTag) {
    foot = `<span class="foot">${e2eTag}</span>`;
  }

  const title = spec.issueFailures[issue.id] ? ` title="${esc(spec.issueFailures[issue.id])}"` : "";
  return `<div class="${classes.join(" ")}" tabindex="0" role="button" data-issue="${esc(issue.id)}" data-spec="${esc(spec.spec)}"${title}>
    ${idLine}${foot}${acts}</div>`;
}

function laneProgress(spec) {
  const total = spec.issues.length;
  const done = spec.issues.filter((i) => i.status === "done" || i.status === "dropped").length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const color = spec.status === "blocked" || spec.status === "spec_blocked" ? "var(--crit)"
    : spec.status === "mergeable" || spec.status === "merged" ? "var(--ok)" : "var(--accent)";
  const stuck = spec.issues.find((i) => i.status === "blocked" || i.status === "human");
  const c2 = spec.status === "mergeable" ? "e2e 綠燈"
    : stuck ? `停在 ${esc(stuck.id)}`
    : spec.status === "verifying" ? "驗證中"
    : spec.elapsedMs != null ? `已跑 ${fmtElapsed(spec.elapsedMs)}`
    : "尚未開始";
  return `<span class="prog">
    <span class="bar"><i style="width:${pct}%; background:${color}"></i></span>
    <span class="c">${done} / ${total}</span>
    <span class="c">${c2}</span>
  </span>`;
}

function renderGrid() {
  const grid = $("grid");
  if (!board) { grid.innerHTML = ""; return; }

  const drafts = board.specs.filter((s) => s.status === "draft");
  const mergedList = board.specs.filter((s) => s.status === "merged");
  const importNeeded = board.specs.filter((s) => s.status === "import_needed");
  const active = board.specs.filter((s) => !["draft", "merged", "import_needed"].includes(s.status));

  const head = COLUMNS.map((c) => `<div class="colhead"><span class="label">${c.label}</span></div>`).join("");

  const lanes = active.map((spec) => {
    const laneClass = selection?.type === "spec" && selection.spec === spec.spec ? "lane on" : "lane";
    const lane = `<button class="${laneClass}" type="button" data-spec="${esc(spec.spec)}">
      <span class="name">${esc(spec.spec)}</span>
      <span class="branch">${esc(spec.branch)}</span>
      <span class="spacer"></span>
      ${laneProgress(spec)}
    </button>`;
    const cells = COLUMNS.map((col) => {
      const cards = spec.issues.filter(col.match).map((i) => issueCard(spec, i)).join("");
      return `<div class="cell">${cards}</div>`;
    }).join("");
    return lane + cells;
  }).join("");

  const errLanes = importNeeded.map((spec) => `
    <div class="lane err">
      <span class="name">${esc(spec.spec)}</span>
      <span class="branch">需匯入 -- ${esc(spec.error ?? "")}</span>
    </div>`).join("");

  const foldRow = (label, list) => list.length ? `<button class="fold" type="button">
      <span class="tw" aria-hidden="true">▸</span>
      <span class="ttl">${label} ${list.length}</span>
      <span class="names">${list.map((s) => esc(s.spec)).join(" · ")}</span>
    </button>` : "";

  grid.innerHTML = head + errLanes + lanes + foldRow("草稿", drafts) + foldRow("已合併", mergedList);
}

function specFacts(spec) {
  const behind = spec.behindMain === null ? "-" : `${spec.behindMain} 個 code commit`;
  return `<dl class="facts">
    <dt class="label">進度</dt><dd>${spec.issues.filter((i) => i.status === "done").length} / ${spec.issues.length} issue 完成</dd>
    <dt class="label">落後 main</dt><dd${spec.behindMain > 0 ? ' class="warnish"' : ""}>${behind}</dd>
    <dt class="label">耗時</dt><dd>${fmtElapsed(spec.elapsedMs)}</dd>
    <dt class="label">花費</dt><dd>${fmtCost(spec.costUsd)}</dd>
    <dt class="label">Token</dt><dd>輸入 ${fmtTokens(spec.inputTokens)} · 輸出 ${fmtTokens(spec.outputTokens)}</dd>
  </dl>`;
}

function renderSpecDetail(spec) {
  const comments = spec.specReviewComments;
  const body = comments === null
    ? '<p class="note-run">spec review 要等全部 issue 到達終端後才跑。</p>'
    : comments.length === 0
      ? '<p class="note-run">沒有意見。</p>'
      : `<div class="cmts"><div class="ch"><span class="label">整體 review 意見 ${comments.length} 條</span></div>
         ${comments.map((c) => `<div class="cmt"><p>${esc(c)}</p></div>`).join("")}</div>`;
  const foot = spec.status === "mergeable"
    ? `<div class="dfoot"><button class="btn primary" data-act="merge" data-spec="${esc(spec.spec)}">合併到 main</button></div>`
    : "";
  const reason = spec.blockedReason ? `<p class="note-run">blocked_reason: ${esc(spec.blockedReason)}</p>` : "";
  return `<div class="dpanel">
    <div class="dhead">
      <span class="label">${esc(SPEC_LABEL[spec.status] ?? spec.status)}</span>
      <h2>${esc(spec.spec)}</h2>
      <div class="sub">${esc(spec.branch)}</div>
    </div>
    ${specFacts(spec)}
    ${reason}${body}
    ${foot}
  </div>`;
}

function renderIssueDetail(spec, issue) {
  const live = spec.currentIssue && spec.currentIssue.id === issue.id ? spec.currentIssue : null;
  const retries = spec.issueRetries[issue.id];
  const failure = spec.issueFailures[issue.id];
  const rows = [];
  if (live) {
    rows.push(`<dt class="label">現在</dt><dd class="live-elapsed" data-since="${live.startedAt}">${esc(ROLE_LABEL[live.role] ?? live.role)} · ${fmtElapsed(Date.now() - live.startedAt)}</dd>`);
    if (live.attempt > 1) rows.push(`<dt class="label">嘗試</dt><dd class="warnish">第 ${live.attempt} / ${spec.domainMaxAttempts} 次</dd>`);
    if (live.diffStat) rows.push(`<dt class="label">目前 diff</dt><dd><span style="color:var(--ok)">+${live.diffStat.insertions}</span> <span style="color:var(--crit)">-${live.diffStat.deletions}</span></dd>`);
  }
  // dev server 的 port 是 devserver.ts 用一個 kind:"port" 事件報上來的，
  // 跟工具呼叫走同一條管線（見 claude.ts 的 LiveEventKind）。
  const portEvent = live?.liveEvents.findLast((e) => e.kind === "port");
  if (portEvent) rows.push(`<dt class="label">連線埠</dt><dd>${esc(portEvent.text)}</dd>`);
  if (retries) rows.push(`<dt class="label">重試</dt><dd${issue.status === "blocked" ? ' class="critish"' : ""}>domain ${retries.domain} / ${spec.domainMaxAttempts} · infra ${retries.infra} / ${spec.infraMaxAttempts}</dd>`);
  if (failure) rows.push(`<dt class="label">退回原因</dt><dd>${esc(failure)}</dd>`);
  if (issue.blockedBy.length) rows.push(`<dt class="label">依賴</dt><dd>${esc(issue.blockedBy.join(", "))}</dd>`);
  if (issue.e2e) rows.push(`<dt class="label">e2e</dt><dd>要跑</dd>`);
  if (issue.stale) rows.push(`<dt class="label">來源</dt><dd class="warnish">spec 或 issue 內容已變更</dd>`);

  const acts = [];
  if (issue.status === "blocked" || issue.status === "human") {
    acts.push(`<button class="btn" data-act="redo" data-spec="${esc(spec.spec)}" data-issue="${esc(issue.id)}">退回 ready</button>`);
  }
  if (issue.stale) {
    acts.push(`<button class="btn" data-act="redo" data-spec="${esc(spec.spec)}" data-issue="${esc(issue.id)}">重做</button>`);
    acts.push(`<button class="btn" data-act="acknowledge-stale" data-spec="${esc(spec.spec)}" data-issue="${esc(issue.id)}">忽略變更</button>`);
  }

  return `<div class="dpanel">
    <div class="dhead">
      <span class="label">${esc(ISSUE_LABEL[issue.status] ?? issue.status)} · ${esc(spec.spec)}</span>
      <h2>${esc(issue.id)} ${esc(issue.title)}</h2>
      <div class="sub">${esc(issue.path)}</div>
    </div>
    <dl class="facts">${rows.join("") || '<dt class="label">狀態</dt><dd>沒有額外資訊</dd>'}</dl>
    ${renderLiveStream(live)}
    ${acts.length ? `<div class="dfoot">${acts.join("")}</div>` : ""}
  </div>`;
}

function renderLiveStream(live) {
  if (!live || !live.liveEvents.length) return "<div></div>";
  const lines = live.liveEvents.map((e, i) => {
    const cls = (e.kind === "say" ? "say" : "tool") + (i === live.liveEvents.length - 1 ? " now" : "");
    const time = new Date(e.at).toLocaleTimeString("zh-TW", { hour12: false });
    return `<div class="line ${cls}"><span class="t">${esc(time)}</span><span class="k">${esc(LIVE_KIND_LABEL[e.kind] ?? e.kind)}</span><span class="m">${esc(e.text)}</span></div>`;
  }).join("");
  return `<div class="stream">
    <div class="st-head"><span class="pulse" aria-hidden="true"></span><span class="label">${esc(ROLE_LABEL[live.role] ?? live.role)} 即時輸出</span></div>
    ${lines}
  </div>`;
}

function renderDetail() {
  const el = $("detail");
  if (!board || !selection) { el.innerHTML = '<p class="note-run">選一個 spec 或 issue 看詳情。</p>'; return; }
  if (selection.type === "spec") {
    const spec = findSpec(selection.spec);
    el.innerHTML = spec ? renderSpecDetail(spec) : '<p class="note-run">這個 spec 不見了。</p>';
  } else {
    const spec = findSpec(selection.spec);
    const issue = spec && findIssue(selection.spec, selection.issue);
    el.innerHTML = spec && issue ? renderIssueDetail(spec, issue) : '<p class="note-run">這個 issue 不見了。</p>';
  }
  // 每次 render 都整個重畫，捲動位置會跟著重設 -- 即時輸出永遠貼底顯示最新
  // 一行，才有「看得到 agent 現在在幹嘛」的感覺，不用使用者自己往下拉。
  const stream = el.querySelector(".stream");
  if (stream) stream.scrollTop = stream.scrollHeight;
}

// 只有「目前正在跑的那個 issue」需要即時跳動的耗時數字，其餘資料都是
// SSE/poll 觸發整頁重抓即可，不必為了一個數字每秒重繪整個看板。
function restartLiveTick() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(() => {
    document.querySelectorAll(".live-elapsed[data-since]").forEach((el) => {
      const since = Number(el.dataset.since);
      const prefix = el.textContent.includes("·") ? el.textContent.split("·")[0] + "· " : "";
      el.textContent = prefix + fmtElapsed(Date.now() - since);
    });
  }, 1000);
}

// 資料夾選取器。路徑由 /api/browse 提供 -- 瀏覽器自己的資料夾選取拿不到絕對
// 路徑，而這裡要的就是絕對路徑。<dialog> 的 close(value) 直接當回傳值用，Esc
// 關閉會給空字串，剛好等於「沒選」。
let pickerPath = null;

async function loadPicker(path) {
  let data;
  try {
    data = await api(`/api/browse?path=${encodeURIComponent(path ?? "")}`);
  } catch (err) {
    $("picker-path").textContent = `讀不到：${err.message}`;
    return;
  }
  pickerPath = data.path;
  const base = data.path.replace(/\/$/, "");
  $("picker-path").textContent = data.path + (data.isRepo ? "  (git repo)" : "");
  $("picker-list").innerHTML =
    (data.parent ? `<li data-path="${esc(data.parent)}">../</li>` : "") +
    data.dirs.map((d) =>
      `<li data-path="${esc(base + "/" + d.name)}">${esc(d.name)}${d.isRepo ? '<span class="repo">git</span>' : ""}</li>`
    ).join("");
}

function browseForRepo() {
  const dlg = $("picker");
  loadPicker($("new-ws-path").value.trim() || null);
  dlg.addEventListener("close", () => {
    if (!dlg.returnValue) return;
    $("new-ws-path").value = dlg.returnValue;
    if (!$("new-ws-name").value.trim()) $("new-ws-name").value = dlg.returnValue.split("/").pop();
  }, { once: true });
  dlg.showModal();
}

$("picker-list").addEventListener("click", (e) => {
  const li = e.target.closest("li[data-path]");
  if (li) loadPicker(li.dataset.path);
});
$("picker-cancel").addEventListener("click", () => $("picker").close(""));
$("picker-pick").addEventListener("click", () => $("picker").close(pickerPath ?? ""));

function openNewWorkspace() {
  $("new-ws-name").value = "";
  $("new-ws-path").value = "";
  $("newws-err").textContent = "";
  $("newws").showModal();
}

async function addWorkspace() {
  const name = $("new-ws-name").value.trim();
  const repoPath = $("new-ws-path").value.trim();
  if (!name || !repoPath) { $("newws-err").textContent = "名稱與路徑都要填。"; return; }
  try {
    await api("/api/workspaces", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, repoPath }),
    });
    $("newws").close();
    currentWs = name;
    await refresh();
  } catch (err) {
    $("newws-err").textContent = `新增失敗：${err.message}`;
  }
}

$("add-ws").addEventListener("click", addWorkspace);
$("browse-ws").addEventListener("click", browseForRepo);
$("newws-cancel").addEventListener("click", () => $("newws").close());

document.addEventListener("click", async (e) => {
  const actBtn = e.target.closest("button[data-act]");
  if (actBtn) {
    e.stopPropagation();
    const { act, spec, issue } = actBtn.dataset;
    const base = `/api/workspaces/${encodeURIComponent(currentWs)}/specs/${encodeURIComponent(spec)}`;
    const url = act === "merge" ? `${base}/merge` : `${base}/issues/${encodeURIComponent(issue)}/${act}`;
    actBtn.disabled = true;
    try {
      const result = await api(url, { method: "POST" });
      if (act === "merge" && !result.merged) say(`合併失敗：${result.reason}`);
      else say("");
    } catch (err) {
      say(`${act} 失敗：${err.message}`);
    }
    await refresh();
    return;
  }

  const lane = e.target.closest(".lane[data-spec]");
  if (lane) { selection = { type: "spec", spec: lane.dataset.spec }; render(); return; }

  const card = e.target.closest(".card[data-issue]");
  if (card) { selection = { type: "issue", spec: card.dataset.spec, issue: card.dataset.issue }; render(); return; }
});

const events = new EventSource("/api/events");
// EventSource 斷線會自己重連。重連後 bootId 換了代表 server 是新起的進程，
// 手上這份 HTML/JS 可能已經跟後端對不上，直接重載。npm run dev 的 --watch
// 靠這條讓改完 ui.html 不用手動 F5；一般重啟 server 也適用。
let bootId = null;
events.addEventListener("connected", (e) => {
  const id = JSON.parse(e.data).bootId;
  if (bootId && bootId !== id) location.reload();
  bootId = id;
});
events.addEventListener("board-changed", (e) => {
  const data = JSON.parse(e.data);
  if (!currentWs || data.workspace === currentWs) refresh();
});
// SSE 只在排程器實際改變東西時觸發；一個 issue 跑很久的期間不會有事件，
// 靠這個保底 poll 讓 cost/token/耗時之類的數字不會看起來卡住。
setInterval(refresh, 10000);

refresh();
</script>
